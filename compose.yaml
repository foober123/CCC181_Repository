services:
  db:
    image: postgres:17
    container_name: deliveryqueue-db
    environment:
      POSTGRES_USER: deliveryqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deliveryqueue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryqueue -d deliveryqueue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
